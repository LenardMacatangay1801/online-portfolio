    <script>
      try {
        var saved = localStorage.getItem('resume-theme')
        var allowed = ['ink', 'heliotrope', 'rose', 'red', 'blue']
        document.documentElement.dataset.theme =
          allowed.indexOf(saved) !== -1 ? saved : 'heliotrope'
      } catch (e) {
        document.documentElement.dataset.theme = 'heliotrope'
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
